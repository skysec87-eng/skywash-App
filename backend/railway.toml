# Railway service config for the Spring Boot API.
# In Railway: set Root Directory = backend (or deploy this folder as the service root).
[build]
builder = "NIXPACKS"
buildCommand = "mvn -DskipTests package"

[deploy]
startCommand = "java -jar target/skywash-api-0.1.0.jar"
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
