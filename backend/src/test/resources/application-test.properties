spring.datasource.url=jdbc:h2:mem:skywash;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Keep order status progression off during integration tests
spring.task.scheduling.enabled=false

# Test profile — no real Paystack / SMTP calls
paystack.secret-key=
paystack.public-key=
paystack.callback-url=http://127.0.0.1:3000/?payment=callback
skywash.mail.enabled=false
skywash.otp.expose-code=true
resend.api-key=
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
google.oauth.client-id=
google.oauth.client-secret=
google.maps.api-key=
llama.api-key=
support.email=isaac.arinze.dev@gmail.com
