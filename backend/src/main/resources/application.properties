server.port=${PORT:8080}
spring.application.name=skywash-api

# PostgreSQL (override with SPRING_DATASOURCE_* on Render)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/skywash}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:skywash}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:skywash}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# Comma-separated origins for the static frontend
skywash.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:3000,http://localhost:3000,https://sudsnear-deploy.vercel.app}

# Mail / OTP — prefer Resend (HTTP). SMTP/Mailtrap remains a local fallback.
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
skywash.mail.enabled=${MAIL_ENABLED:true}
skywash.mail.from=${MAIL_FROM:skyWash <onboarding@resend.dev>}
skywash.otp.expose-code=${SKYWASH_OTP_EXPOSE_CODE:false}
resend.api-key=${RESEND_API_KEY:}

# Google OAuth — set GOOGLE_OAUTH_* on the host (Railway/Render)
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}

# Google Maps Geocoding. If unset, OpenStreetMap Nominatim resolves worldwide addresses.
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
skywash.geocode.nominatim=${GEOCODE_NOMINATIM:true}

# Live laundry POIs near pickup (OpenStreetMap Overpass). Off in tests.
skywash.discovery.overpass=${LAUNDRY_DISCOVERY:true}

# Meta Llama — skyWash Assist (OpenAI-compatible host: Groq / Together / Fireworks / Meta)
# Falls back to canned status-aware text if key unset or API fails.
llama.api-key=${LLAMA_API_KEY:${META_LLAMA_API_KEY:}}
llama.base-url=${LLAMA_BASE_URL:https://api.groq.com/openai/v1}
llama.model=${LLAMA_MODEL:llama-3.3-70b-versatile}

# Human support escalation (Assist shares this when users ask for a person)
support.email=${SUPPORT_EMAIL:isaac.arinze.dev@gmail.com}

# Partner ops dashboard + delivery-confirm notifications
ops.pin=${OPS_PIN:}
partner.notify.fallback-email=${PARTNER_NOTIFY_FALLBACK_EMAIL:${SUPPORT_EMAIL:isaac.arinze.dev@gmail.com}}
whatsapp.token=${WHATSAPP_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}

# Paystack — set PAYSTACK_* on the host (never commit secrets)
spring.config.import=optional:classpath:application-local.properties
paystack.secret-key=${PAYSTACK_SECRET_KEY:}
paystack.public-key=${PAYSTACK_PUBLIC_KEY:}
paystack.callback-url=${PAYSTACK_CALLBACK_URL:http://127.0.0.1:3000/?payment=callback}
paystack.frontend-callback-url=${PAYSTACK_FRONTEND_CALLBACK_URL:http://127.0.0.1:3000/?payment=callback}
