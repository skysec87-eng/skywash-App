server.port=${PORT:8080}
spring.application.name=skywash-api

# PostgreSQL (override with SPRING_DATASOURCE_* on Render)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/skywash}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:skywash}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:skywash}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# Comma-separated origins for the static frontend
skywash.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:3000,http://localhost:3000,https://sudsnear-deploy.vercel.app}

# Mail / OTP — credentials via env (.env → scripts/run-api.sh) or application-local.properties
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
skywash.mail.enabled=${MAIL_ENABLED:true}
skywash.mail.from=${MAIL_FROM:skyWash <noreply@skywash.test>}
skywash.otp.expose-code=false

# Google OAuth — set GOOGLE_OAUTH_* in .env (never commit secrets)
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}

# Paystack — set PAYSTACK_* in .env (never commit secrets)
spring.config.import=optional:classpath:application-local.properties
paystack.secret-key=${PAYSTACK_SECRET_KEY:}
paystack.public-key=${PAYSTACK_PUBLIC_KEY:}
paystack.callback-url=${PAYSTACK_CALLBACK_URL:http://127.0.0.1:3000/?payment=callback}
paystack.frontend-callback-url=${PAYSTACK_FRONTEND_CALLBACK_URL:http://127.0.0.1:3000/?payment=callback}
